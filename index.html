<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイピングできないOL ── 寸劇タイピング道場</title>
<style>
  /* ───────────────────────────────────────────────────────────
     見た目はここ（CONFIG的なゾーン）。色を変えるだけで雰囲気が変わります。
     ─────────────────────────────────────────────────────────── */
  :root{
    --bg:#fdf6f0; --paper:#ffffff; --ink:#3a3a3a; --sub:#8a8a8a;
    --me:#ff8fab; --me-bg:#ffe6ee; --ai:#5fb0ff; --ai-bg:#e6f1ff;
    --ok:#36c08a; --warn:#ff5d5d; --cur:#ffd23f; --line:#ece3da;
    --shadow:0 4px 14px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#fff,transparent),var(--bg);
    color:var(--ink); display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    padding:14px 18px; text-align:center; border-bottom:1px dashed var(--line);
    background:var(--paper); box-shadow:var(--shadow); position:relative;
  }
  #menuBtn{
    position:absolute; top:50%; right:14px; transform:translateY(-50%);
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:999px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;
  }
  #menuBtn:hover{background:#f6f1ea}
  header h1{margin:0;font-size:18px;letter-spacing:.04em}
  header .ep{margin-top:4px;font-size:12px;color:var(--sub)}
  main{flex:1;max-width:680px;width:100%;margin:0 auto;padding:16px 14px 0;display:flex;flex-direction:column}
  /* 台本（チャット）エリア */
  #stage{flex:1;overflow-y:auto;padding:6px 2px 12px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:8px;align-items:flex-end;animation:pop .25s ease}
  .row.me{flex-direction:row-reverse}
  .avatar{font-size:26px;width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;
          background:var(--paper);border-radius:50%;box-shadow:var(--shadow)}
  .bubble{max-width:78%;padding:10px 14px;border-radius:16px;line-height:1.6;box-shadow:var(--shadow);
          font-size:15px;white-space:pre-wrap;word-break:break-word}
  .me .bubble{background:var(--me-bg);border-bottom-right-radius:4px}
  .ai .bubble{background:var(--ai-bg);border-bottom-left-radius:4px}
  .name{font-size:11px;color:var(--sub);margin:0 6px 2px}
  .narration{align-self:center;color:var(--sub);font-size:13px;font-style:italic;
             background:#fffdf8;border:1px dashed var(--line);padding:6px 14px;border-radius:20px}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* 操作バー（つぎへ） */
  #advance{display:none;margin:10px auto 16px;padding:10px 22px;border:none;border-radius:999px;
           background:var(--ai);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
  #advance:hover{filter:brightness(1.05)}

  /* タイピングパネル */
  #typer{display:none;position:sticky;bottom:0;background:var(--paper);
         border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08);
         padding:14px 16px 16px;margin-top:auto}
  #typer .display{font-size:18px;font-weight:700;text-align:center;margin-bottom:6px}
  #note{display:none;font-size:14px;color:#5b6b39;text-align:center;
        background:#f3f7e6;border:1px solid #d7e3b6;border-radius:10px;
        padding:8px 12px;margin:4px auto 12px;max-width:92%;line-height:1.5}
  #note::before{content:"💬 意味：";font-weight:700;color:#7a8a4a}
  #kana{font-size:26px;text-align:center;letter-spacing:.02em;line-height:1.7;margin-bottom:6px}
  #kana .u{padding:0 1px;border-radius:6px}
  #kana .done{color:var(--ok)}
  #kana .cur{background:var(--cur);box-shadow:0 0 0 3px rgba(255,210,63,.4);border-radius:6px}
  #kana .todo{color:#c9c0b6}
  /* スペースのマスは「打つキーがある」と分かるよう下線で可視化 */
  #kana .space{display:inline-block;min-width:1.1em;border-bottom:3px solid #c9c0b6;color:#c9c0b6;line-height:1.1}
  #kana .space.done{border-bottom-color:var(--ok);color:var(--ok)}
  #kana .space.cur{border-bottom-color:#e0a800;color:#9a7400}
  #roma{font-size:14px;color:var(--sub);text-align:center;min-height:20px;letter-spacing:.06em}
  #roma b{color:var(--ink);background:#fff7d6;padding:0 4px;border-radius:5px}
  .stats{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:13px;color:var(--sub)}
  .stats b{color:var(--ink);font-size:16px}
  #typer.shake{animation:shake .18s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .hint{text-align:center;font-size:12px;color:var(--sub);margin-top:8px}
  #catcher{position:absolute;opacity:0;height:1px;width:1px;pointer-events:none}

  /* ショートカット練習パネル */
  #shortcut{display:none;position:sticky;bottom:0;background:var(--paper);border:1px solid var(--line);
            border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:18px 16px 20px;margin-top:auto;text-align:center}
  #shortcut .sc-goal{font-size:16px;font-weight:700;margin-bottom:12px}
  #shortcut .sc-combo{display:inline-block;font-size:24px;font-weight:800;letter-spacing:.04em;
            background:#eef4ff;border:2px solid var(--ai);color:#2b6fd6;border-radius:12px;padding:10px 22px;box-shadow:var(--shadow)}
  #shortcut .sc-prompt{font-size:13px;color:var(--sub);margin-top:10px}
  #shortcut.shake{animation:shake .18s}

  /* リザルト */
  #result{display:none;text-align:center;padding:24px 16px}
  #result h2{margin:.2em 0}
  .cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
  .card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:14px 20px;min-width:120px}
  .card .v{font-size:30px;font-weight:800}
  .card .l{font-size:12px;color:var(--sub)}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .btns button{border:none;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
  .btns .primary{background:var(--me);color:#fff}
  .btns .ghost{background:#fff;color:var(--ink)}
  footer{text-align:center;font-size:11px;color:var(--sub);padding:10px}
  .badge{display:inline-block;background:var(--me-bg);color:#c2407a;border-radius:999px;padding:2px 10px;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>⌨️ タイピングできないOL ── 寸劇タイピング道場</h1>
  <div class="ep" id="epLabel"></div>
  <button id="menuBtn">☰ 目次</button>
</header>

<main>
  <div id="stage"></div>
  <button id="advance">▶ つぎへ（Enter）</button>

  <div id="typer">
    <div class="display" id="display"></div>
    <div id="note"></div>
    <div id="kana"></div>
    <div id="roma"></div>
    <div class="stats">
      <div><b id="sWpm">0</b><br>WPM</div>
      <div><b id="sAcc">100</b><br>正確率%</div>
      <div><b id="sMiss">0</b><br>ミス</div>
    </div>
    <div class="hint">「わたし」になりきって打ってみよう（ローマ字／ん=nn・小さい っ は次の子音を重ねる／記号・英字はそのまま・大文字はShift）</div>
    <input id="catcher" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>

  <div id="shortcut">
    <div class="sc-goal" id="scGoal"></div>
    <div class="sc-combo" id="scCombo"></div>
    <div class="sc-prompt">↑ このキーを押してみよう</div>
    <div class="hint" id="scHint"></div>
  </div>

  <div id="result">
    <h2 id="rTitle">おつかれさま！</h2>
    <div class="badge" id="rRank"></div>
    <div id="rExtra" style="color:var(--sub);font-size:13px;margin-top:8px"></div>
    <div class="cards">
      <div class="card"><div class="v" id="rWpm">0</div><div class="l">平均WPM</div></div>
      <div class="card"><div class="v" id="rAcc">0</div><div class="l">正確率 %</div></div>
      <div class="card"><div class="v" id="rMiss">0</div><div class="l">合計ミス</div></div>
      <div class="card"><div class="v" id="rBest">–</div><div class="l">自己ベストWPM</div></div>
    </div>
    <div class="btns">
      <button class="primary" id="rNext">▶ 次の話へ</button>
      <button class="ghost" id="rRetry">↺ もう一度</button>
      <button class="ghost" id="rTop">話を選ぶ</button>
    </div>
  </div>
</main>

<footer>記録はこの端末のなかだけに保存されます（外部に送信しません）。授業で学ぶ「個人情報の扱い」をそのまま実践。</footer>

<script>

   ① 物語データ ── ここを書き換えれば話を追加・編集できます
   who: 'me'（わたし）/ 'ai'（AI）/ 'narration'（ト書き）
   type シーン: {type:'type', display:'画面に出す文', kana:'うつひらがな'}
   ※ kana はひらがな（＋小書き・長音ー）だけにしてください
   ════════════════════════════════════════════════════════════════ */
const CHARS = {
  me: {name:'私', cls:'me', avatar:'🙂‍↔️'},
  ai: {name:'AI',     cls:'ai', avatar:'🤖'},
};

/* OS（Windows / Mac）── 第7話のショートカット表記を出し分ける。一度選ぶと記憶。 */
let OS = localStorage.getItem('typing-ol-os');   // 'win' | 'mac' | null
function osTokens(){
  return OS==='mac'
    ? {MOD:'⌘',    SCREENSHOT:'⌘+Shift+4', SWITCH:'⌘+Tab',  RELOAD:'⌘+R'}
    : {MOD:'Ctrl', SCREENSHOT:'Win+Shift+S', SWITCH:'Alt+Tab', RELOAD:'F5'};
}
function fillTokens(t){ const k=osTokens(); return String(t).replace(/\{(\w+)\}/g,(m,p)=>k[p]??m); }

/* 安全に横取りできるショートカットだけを定義（F5/Alt+Tab等は寸劇で紹介） */
const COMBOS = {
  'shift-enter':{test:e=>e.key==='Enter'&&e.shiftKey,                              keys:'Shift + Enter', desc:'改行（送信せずに行を足す）'},
  'find' :{test:e=>(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f',              keys:'{MOD} + F', desc:'ページ内をことばで検索'},
  'all'  :{test:e=>(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a',              keys:'{MOD} + A', desc:'ぜんぶ選択'},
  'copy' :{test:e=>(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c',              keys:'{MOD} + C', desc:'コピー'},
  'paste':{test:e=>(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v',              keys:'{MOD} + V', desc:'貼り付け'},
  'undo' :{test:e=>(e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z', keys:'{MOD} + Z', desc:'直前の操作を取り消す'},
  'esc'  :{test:e=>e.key==='Escape',                                               keys:'Esc', desc:'止める・閉じる'},
};

const STORY = [

/* ════════════════════════════════════════════════════════════════
   ② ローマ字エンジン（拗音・促音・長音・複数表記に対応）
   ════════════════════════════════════════════════════════════════ */
const ROMA = {
  'あ':['a'],'い':['i'],'う':['u','wu'],'え':['e'],'お':['o'],
  'か':['ka','ca'],'き':['ki'],'く':['ku'],'け':['ke'],'こ':['ko'],
  'さ':['sa'],'し':['shi','si'],'す':['su'],'せ':['se'],'そ':['so'],
  'た':['ta'],'ち':['chi','ti'],'つ':['tsu','tu'],'て':['te'],'と':['to'],
  'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
  'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],
  'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
  'や':['ya'],'ゆ':['yu'],'よ':['yo'],
  'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
  'わ':['wa'],'を':['wo'],'ん':['nn','xn'],
  'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
  'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
  'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
  'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
  'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
  'ー':['-'],'、':[','],'。':['.'],'！':['!'],'？':['?'],' ':[' '],
  'ぁ':['xa','la'],'ぃ':['xi','li'],'ぅ':['xu','lu'],'ぇ':['xe','le'],'ぉ':['xo','lo'],
};
const YOUON = {
  'きゃ':['kya'],'きゅ':['kyu'],'きょ':['kyo'],
  'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],
  'ちゃ':['cha','tya'],'ちゅ':['chu','tyu'],'ちょ':['cho','tyo'],
  'にゃ':['nya'],'にゅ':['nyu'],'にょ':['nyo'],
  'ひゃ':['hya'],'ひゅ':['hyu'],'ひょ':['hyo'],
  'みゃ':['mya'],'みゅ':['myu'],'みょ':['myo'],
  'りゃ':['rya'],'りゅ':['ryu'],'りょ':['ryo'],
  'ぎゃ':['gya'],'ぎゅ':['gyu'],'ぎょ':['gyo'],
  'じゃ':['ja','jya','zya'],'じゅ':['ju','jyu','zyu'],'じょ':['jo','jyo','zyo'],
  'びゃ':['bya'],'びゅ':['byu'],'びょ':['byo'],
  'ぴゃ':['pya'],'ぴゅ':['pyu'],'ぴょ':['pyo'],
};

// 文字列 → 入力単位の配列に変換
//  kind:'kana' … ひらがな（ローマ字へ変換。入力は小文字に正規化）
//  kind:'code' … 記号・英字・数字（そのまま打つ。大文字や記号はShiftが要る）
function buildUnits(kana){
  const units=[]; let sokuon=false;
  for(let i=0;i<kana.length;i++){
    const c=kana[i];
    if(c==='っ'){ sokuon=true; continue; }
    const pair=c+(kana[i+1]||'');
    let label, cands, kind;
    if(YOUON[pair]){ label=pair; cands=YOUON[pair].slice(); kind='kana'; i++; }
    else if(ROMA[c]){ label=(c===' '?'␣':c); cands=ROMA[c].slice(); kind='kana'; }
    else { label=(c===' '?'␣':c); cands=[c]; kind='code'; }   // ← 記号・英字はそのまま
    if(sokuon){
      const dbl    = cands.filter(r=>/^[a-z]/.test(r)).map(r=>r[0]+r);
      const little = ['xtu','ltu'].flatMap(p=>cands.map(r=>p+r));
      cands = dbl.concat(little);
      label = 'っ'+label; kind='kana';
      sokuon=false;
    }
    units.push({label, cands, kind});
  }
  if(sokuon) units.push({label:'っ', cands:['xtu','ltu'], kind:'kana'});
  return units;
}

/* ════════════════════════════════════════════════════════════════
   ③ 進行＆タイピング制御
   ════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const stage=$('stage'), advBtn=$('advance'), typer=$('typer'), catcher=$('catcher');

let epIndex = 0;       // いま何話目か
let sceneIndex = 0;    // 話のなかの何シーンめか
let units=[], uIdx=0, buf='';
let lineStart=0, lineMiss=0, lineCorrect=0;
let epRuns=[];         // この話のタイプ結果（{wpm,acc,miss}）
let epShortcuts=0;     // この話で押せたショートカット数
let curCombo=null, curScene=null;

function hidePanels(){ typer.style.display='none'; $('shortcut').style.display='none'; advBtn.style.display='none'; curCombo=null; }

function startEpisode(n){
  // ショートカット回は、先にOS（Win/Mac）を選んでもらう
  if(STORY[n].needsOS && !OS){ return askOS(()=>startEpisode(n)); }
  epIndex=n; sceneIndex=0; epRuns=[]; epShortcuts=0;
  stage.innerHTML=''; $('result').style.display='none'; hidePanels();
  $('epLabel').textContent = STORY[n].title;
  next();
}

/* OS選択画面 */
function askOS(then){
  hidePanels(); $('result').style.display='none';
  $('epLabel').textContent='この回はキーボード操作を扱います';
  stage.innerHTML='';
  const box=document.createElement('div'); box.style.cssText='text-align:center;margin-top:28px';
  box.innerHTML='<div style="font-size:17px;font-weight:700;margin-bottom:6px">あなたのパソコンは？</div>'
    +'<div style="font-size:12px;color:var(--sub);margin-bottom:16px">ショートカットの表記を合わせます（あとで変えられます）</div>';
  const row=document.createElement('div'); row.style.cssText='display:flex;gap:12px;justify-content:center;flex-wrap:wrap';
  const mk=(label,val,emoji)=>{const b=document.createElement('button');
    b.style.cssText='border:none;border-radius:16px;padding:18px 30px;font-size:17px;font-weight:700;cursor:pointer;background:var(--ai);color:#fff;box-shadow:var(--shadow)';
    b.textContent=emoji+' '+label; b.onclick=()=>{ OS=val; localStorage.setItem('typing-ol-os',val); then(); }; return b;};
  row.appendChild(mk('Windows','win','🪟'));
  row.appendChild(mk('Mac','mac','🍎'));
  box.appendChild(row); stage.appendChild(box);
}

function addBubble(who, text){
  if(who==='narration'){
    const d=document.createElement('div'); d.className='narration'; d.textContent=text;
    stage.appendChild(d); scrollDown(); return;
  }
  const ch=CHARS[who];
  const row=document.createElement('div'); row.className='row '+ch.cls;
  const av=document.createElement('div'); av.className='avatar'; av.textContent=ch.avatar;
  const box=document.createElement('div');
  const name=document.createElement('div'); name.className='name'; name.textContent=ch.name;
  const bub=document.createElement('div'); bub.className='bubble'; bub.textContent=text;
  box.appendChild(name); box.appendChild(bub);
  row.appendChild(av); row.appendChild(box);
  stage.appendChild(row); scrollDown();
}
function scrollDown(){ stage.scrollTop = stage.scrollHeight; }

// 次のシーンへ
function next(){
  const ep=STORY[epIndex];
  if(sceneIndex>=ep.scenes.length){ return finishEpisode(); }
  const sc=ep.scenes[sceneIndex++];
  if(sc.type==='type'){ startTyping(sc); }
  else if(sc.type==='shortcut'){ startShortcut(sc); }
  else {
    addBubble(sc.who, fillTokens(sc.text));
    typer.style.display='none'; $('shortcut').style.display='none'; curCombo=null;
    advBtn.style.display='block';
  }
}

advBtn.addEventListener('click', ()=>{ advBtn.style.display='none'; next(); });
document.addEventListener('keydown', e=>{
  if(advBtn.style.display==='block' && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); advBtn.click(); }
});

/* ── ショートカット練習 ── */
function startShortcut(sc){
  advBtn.style.display='none'; typer.style.display='none';
  curScene=sc; curCombo=COMBOS[sc.combo];
  $('scGoal').textContent = sc.display || curCombo.desc;
  $('scCombo').textContent = fillTokens(curCombo.keys);
  $('scHint').textContent = curCombo.desc + '　／　うまく押せたら次へ進みます';
  $('shortcut').style.display='block';
  $('shortcut').scrollIntoView({block:'end', behavior:'smooth'});
}
document.addEventListener('keydown', e=>{
  if($('shortcut').style.display!=='block' || !curCombo) return;
  // 練習中はブラウザの既定動作を横取り（Ctrl+F の検索バーなどを出さない）
  if(e.ctrlKey||e.metaKey||e.altKey||e.key==='Escape'||e.key==='Enter') e.preventDefault();
  if(curCombo.test(e)){
    const sc=curScene; curCombo=null; epShortcuts++;
    $('shortcut').style.display='none';
    if(sc.say) addBubble('me', fillTokens(sc.say));
    setTimeout(next, 320);
  } else if(e.ctrlKey||e.metaKey||e.altKey||e.key==='Escape'||(e.key==='Enter'&&e.shiftKey)){
    const el=$('shortcut'); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),180);
  }
});

/* ── タイピング開始 ── */
function startTyping(sc){
  advBtn.style.display='none'; $('shortcut').style.display='none'; curCombo=null;
  units = buildUnits(sc.kana);
  uIdx=0; buf=''; lineStart=0; lineMiss=0; lineCorrect=0;
  $('display').textContent = sc.display;
  $('note').textContent = sc.note || '';
  $('note').style.display = sc.note ? 'block' : 'none';
  typer.style.display='block';
  renderKana(); renderRoma(); updateStats();
  catcher.value=''; catcher.focus();
  scrollToTyper();
}
function scrollToTyper(){ typer.scrollIntoView({block:'end', behavior:'smooth'}); }

function renderKana(){
  const el=$('kana'); el.innerHTML='';
  units.forEach((u,i)=>{
    const s=document.createElement('span');
    s.className='u '+(i<uIdx?'done':(i===uIdx?'cur':'todo'));
    if(u.cands[0]===' ') s.classList.add('space');   // スペースのマスを強調
    s.textContent=u.label;
    el.appendChild(s);
  });
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function renderRoma(){
  const el=$('roma');
  if(uIdx>=units.length){ el.innerHTML=''; return; }
  const u=units[uIdx], cur=u.cands[0];
  if(cur===' '){ el.innerHTML='いま打つ: <b>␣</b>　← スペースキー'; return; }
  const typed=esc(buf), rest=esc(cur.slice(buf.length));
  let extra = (u.cands.length>1) ? `（他: ${esc(u.cands.slice(1).join(' / '))}）` : '';
  if(u.kind==='code' && /[A-Z!@#$%^&*()_+{}|:"<>?~]/.test(cur)) extra += ' ⇧Shiftが要るかも';
  el.innerHTML = `いま打つ: <b>${typed||'&nbsp;'}</b>${rest}　${extra}`;
}
function updateStats(){
  const sec=(lineStart?(performance.now()-lineStart):0)/1000;
  const wpm = sec>0 ? Math.round((lineCorrect/5)/(sec/60)) : 0;
  const total=lineCorrect+lineMiss;
  const acc = total>0 ? Math.round(lineCorrect/total*100) : 100;
  $('sWpm').textContent=wpm; $('sAcc').textContent=acc; $('sMiss').textContent=lineMiss;
}

// キー入力（PC）
document.addEventListener('keydown', e=>{
  if(typer.style.display!=='block') return;
  if(e.key.length!==1) return;            // 文字キーのみ
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  e.preventDefault();
  handleChar(e.key);
});
// スマホ等のIME無し入力フォールバック
catcher.addEventListener('input', ()=>{
  const v=catcher.value; catcher.value='';
  for(const ch of v) handleChar(ch);
});
// パネルをタップしたらキーボードを呼ぶ
typer.addEventListener('click', ()=>catcher.focus());

function handleChar(ch){
  if(uIdx>=units.length) return;
  const u=units[uIdx];
  const input = (u.kind==='code') ? ch : ch.toLowerCase();  // 記号・英字は大文字小文字を区別
  if(lineStart===0) lineStart=performance.now();
  const tryStr=buf+input;
  const canContinue = u.cands.some(c=>c.startsWith(tryStr));
  if(!canContinue){
    lineMiss++; flashMiss(); updateStats(); return;
  }
  buf=tryStr; lineCorrect++;
  if(u.cands.includes(buf)){
    uIdx++; buf='';
    renderKana();
    if(uIdx>=units.length){ updateStats(); return finishLine(); }
  }
  renderRoma(); updateStats();
}
function flashMiss(){ typer.classList.add('shake'); setTimeout(()=>typer.classList.remove('shake'),180); }

/* ── 1行打ち終わり ── */
function finishLine(){
  const sec=(performance.now()-lineStart)/1000;
  const wpm=Math.round((lineCorrect/5)/(sec/60));
  const total=lineCorrect+lineMiss;
  const acc=total>0?Math.round(lineCorrect/total*100):100;
  epRuns.push({wpm,acc,miss:lineMiss});
  const sc=STORY[epIndex].scenes[sceneIndex-1];
  addBubble('me', sc.display);                 // 打ったセリフを吹き出しに
  typer.style.display='none';
  setTimeout(next, 350);
}

/* ── 1話おわり：リザルト ── */
function finishEpisode(){
  hidePanels();
  const n=epRuns.length;
  const avgWpm = n ? Math.round(epRuns.reduce((s,r)=>s+r.wpm,0)/n) : null;
  const avgAcc = n ? Math.round(epRuns.reduce((s,r)=>s+r.acc,0)/n) : null;
  const sumMiss=epRuns.reduce((s,r)=>s+r.miss,0);
  // 自己ベスト保存（タイプがあった話のみ・端末内だけ）
  const key='typing-ol-best-ep'+epIndex;
  const prev=Number(localStorage.getItem(key)||0);
  let best=prev;
  if(avgWpm!==null){ best=Math.max(prev,avgWpm); localStorage.setItem(key, best); }

  $('rWpm').textContent = avgWpm!==null?avgWpm:'–';
  $('rAcc').textContent = avgAcc!==null?avgAcc:'–';
  $('rMiss').textContent=sumMiss; $('rBest').textContent=best||'–';
  $('rRank').textContent = (avgWpm!==null) ? rank(avgWpm,avgAcc) : '🎹 操作マスター';
  $('rExtra').textContent = epShortcuts>0 ? `覚えたショートカット ${epShortcuts}個 🎉` : '';
  $('result').style.display='block';
  $('result').scrollIntoView({behavior:'smooth'});

  $('rNext').style.display = (epIndex+1<STORY.length)?'inline-block':'none';
  $('rNext').onclick=()=>startEpisode(epIndex+1);
  $('rRetry').onclick=()=>startEpisode(epIndex);
  $('rTop').onclick=showMenu;
}
function rank(wpm,acc){
  if(acc>=98 && wpm>=120) return '⭐ 達人OL';
  if(wpm>=80) return '✨ なかなかやるOL';
  if(wpm>=40) return '🌱 成長中OL';
  return '🐣 はじめてOL';
}

/* ── 話を選ぶメニュー ── */
function showMenu(){
  $('result').style.display='none'; hidePanels();
  $('epLabel').textContent='話を選んでください';
  stage.innerHTML='';
  const wrap=document.createElement('div'); wrap.style.cssText='display:flex;flex-direction:column;gap:10px;margin-top:10px';
  STORY.forEach((ep,i)=>{
    const best=localStorage.getItem('typing-ol-best-ep'+i);
    const b=document.createElement('button');
    b.className='primary'; b.style.cssText='border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:#fff;box-shadow:var(--shadow);text-align:left';
    b.innerHTML=`${ep.title}` + (best?`　<span style="color:var(--sub);font-weight:400">自己ベスト ${best} WPM</span>`:'');
    b.onclick=()=>startEpisode(i);
    wrap.appendChild(b);
  });
  stage.appendChild(wrap);
  // OS表示＆切り替え（第7話のショートカット表記用）
  if(OS){
    const osLine=document.createElement('div');
    osLine.style.cssText='text-align:center;margin-top:14px;font-size:12px;color:var(--sub)';
    osLine.innerHTML=`キーボード表記: <b>${OS==='mac'?'Mac（⌘）':'Windows（Ctrl）'}</b> `;
    const ch=document.createElement('button');
    ch.textContent='変更'; ch.style.cssText='border:none;background:none;color:var(--ai);cursor:pointer;font-size:12px;text-decoration:underline';
    ch.onclick=()=>{ OS=null; localStorage.removeItem('typing-ol-os'); askOS(showMenu); };
    osLine.appendChild(ch);
    stage.appendChild(osLine);
  }
}

// ヘッダーの「目次」ボタン：いつでも章選択へ戻る
$('menuBtn').onclick = showMenu;

// 起動
showMenu();
</script>
</body>
